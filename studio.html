r:1px solid #b9ccc5;padding:8px;min-width:70px}.editor pre{background:#eef2ee;padding:10px}.hidden{display:none!important}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tag{padding:5px 10px;background:var(--mint);border-radius:4px;font-size:11px}a{color:#237c85}.footer{position:sticky;bottom:0;padding:12px 0 5px;background:var(--paper);display:flex;gap:8px}#front{height:94px}#source{height:210px}#search{width:100%;margin-bottom:12px}.blank{padding:35px 10px;color:var(--muted)}
</style></head><body><h1 id="heading">Claude Code Studio</h1><p id="subtitle">Agents, skills, plugins, hooks and shortcuts. Your files, in their native formats.</p><div class="row" id="studioBar"><select id="kind" onchange="changeKind()"><option value="agents">Agents</option><option value="sessions">Current sessions</option><option value="plugins">Plugins</option><option value="hooks">Hooks & webhooks</option><option value="shortcuts">Slash commands</option><option value="skills">Skills</option></select><button onclick="chooseProject()">Choose project…</button><span class="grow" id="projectLabel">User configuration</span><button onclick="refresh()">Refresh</button><button id="importSkillButton" class="hidden" onclick="importSkillForm()">Import from URL…</button><button class="primary" onclick="newItem()">＋ Create</button></div><div class="row hidden" id="profileBar"><button class="primary" onclick="newProfile()">＋ Gateway profile</button><a href="https://docs.litellm.ai/docs/proxy/client_setup/claude_code">LiteLLM guide ↗</a><a href="https://github.com/maximhq/bifrost/blob/dev/docs/cli-agents/claude-code.mdx">Bifrost guide ↗</a></div><div id="secretBar" class="row hidden"><button class="primary" onclick="editSecret()">Add secret…</button><button onclick="refresh()">Refresh Keychain status</button><span class="grow">Values stay in macOS Keychain</span></div><div class="layout"><aside><input id="search" placeholder="Search configurations" oninput="renderList()"><div id="list"></div></aside><main id="detail"><div class="blank">Select a configuration or create one.</div></main></div><div id="note"></div><div id="message" role="status"></div>
<script>
let mode='studio',project='',data={},current=null,loaded={},rich=false,dirty=false,pending=new Map(),seq=0;
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function api(request){return new Promise((resolve,reject)=>{let id=++seq;pending.set(id,{resolve,reject});window.webkit.messageHandlers.studio.postMessage({...request,project,requestId:id})})}
function receive({id,result}){let p=pending.get(id);if(!p)return;pending.delete(id);if(result.ok)p.resolve(result);else p.reject(Error(result.error||'Operation failed'))}
function message(s,error=false){$('message').textContent=s;$('message').className=error?'error':''}
async function safe(fn){try{await fn()}catch(e){message(e.message,true)}}
function leave(){return !dirty||confirm('Discard unsaved changes?')}
function start(value){mode=value;if(mode==='secrets'){$('heading').textContent='Secret Manager';$('subtitle').textContent='Named credentials in macOS Keychain. Configuration files contain references, never the secret values.';$('studioBar').classList.add('hidden');$('secretBar').classList.remove('hidden')}if(mode==='mods'){$('heading').textContent='Mods';$('subtitle').textContent='Optional enhancements for your AI workflow. Configure Jev, review skill sources and see recent decisions.';$('studioBar').classList.add('hidden')}if(mode==='profiles'){$('heading').textContent='Your gateways';$('subtitle').textContent='Named profiles for custom proxies, LiteLLM, Bifrost and local Ollama. No proxy software is installed.';$('studioBar').classList.add('hidden');$('profileBar').classList.remove('hidden')}refresh()}
async function refresh(){if(mode==='secrets'){await safe(async()=>{data=await api({op:'secret-list'});renderList();if(current){current=data.entries.find(x=>x.id===current.id);if(current)secretForm(current)}else{$('detail').innerHTML='<div class="blank">Select a credential to see its Keychain location and usage.</div>'}$('note').textContent='Only named app credentials are listed. Existing client OAuth tokens remain managed by their client. Metadata: '+data.registry});return}if(mode==='mods'||(mode==='studio'&&$('kind').value==='jev')){await safe(jevForm);return}$('importSkillButton').classList.toggle('hidden',mode==='profiles'||$('kind').value!=='skills');await safe(async()=>{if(mode!=='profiles'&&$('kind').value==='sessions'){let v=await api({op:'sessions'});data.sessions=v.sessions}else{data=await api({op:mode==='profiles'?'profiles':'inventory'})};renderList();$('note').textContent=$('kind').value==='sessions'?'Sessions reported by Claude Code agents --json. Refresh to update. Nested subagents are not individual rows.':mode==='profiles'?'Credentials are referenced through an executable helper or environment variable; API keys are not saved here.':data.note})}
async function chooseProject(){if(!leave())return;await safe(async()=>{let v=await api({op:'choose-project'});project=v.project;$('projectLabel').textContent=project||'User configuration';dirty=false;current=null;await refresh()})}
function changeKind(){if(!leave())return;current=null;dirty=false;$('detail').innerHTML='<div class="blank">Select a configuration or create one.</div>';refresh()}
function records(){return mode==='secrets'?data.entries||[]:mode==='profiles'?data.profiles||[]:$('kind').value==='sessions'?(data.sessions||[]).map(x=>({...x,scope:x.state||x.status||x.kind,name:x.name||x.sessionId||'Session'})):$('kind').value==='hooks'?data.hooks||[]:(data.records||[]).filter(x=>x.kind===$('kind').value||($('kind').value==='skills'&&x.kind==='shortcuts'))}
function renderList(){if(mode==='mods'){let q=$('search').value.toLowerCase();$('list').innerHTML='jev openrouter decisions skills'.includes(q)?'<button class="item active" onclick="safe(async()=>{if(leave())await jevForm()})"><strong>Jev</strong><small>OpenRouter · decisions & skills</small></button>':'<div class="blank">No matching mods.</div>';return}let q=$('search').value.toLowerCase(),rows=records().filter(x=>JSON.stringify([x.name,x.scope,x.kind,x.label,x.service,x.purpose]).toLowerCase().includes(q));$('list').innerHTML='';for(let x of rows){let b=document.createElement('button');b.className='item'+(current===x?' active':'');b.innerHTML=esc(x.name||x.label||x.scope)+'<small>'+esc(mode==='secrets'?x.status:mode==='profiles'?(x.id===data.selected?'Selected · ':'')+x.kind:(x.scope+(x.readonly?' · Installed / read-only':'')))+'</small>';b.onclick=()=>select(x);$('list').append(b)}if(!rows.length)$('list').innerHTML='<div class="blank">No configurations found.</div>'}
async function select(x){if(!leave())return;current=x;dirty=false;renderList();await safe(async()=>{if(mode==='secrets'){secretForm(x);return}if(mode==='profiles'){await profileForm(x);return}if($('kind').value==='sessions'){$('detail').innerHTML='<h2>'+esc(x.name||'Session')+'</h2><small>'+esc(x.cwd)+'</small><textarea readonly style="height:310px">'+esc(JSON.stringify(x,null,2))+'</textarea><p><a href="https://code.claude.com/docs/en/agent-view">Official session monitoring reference ↗</a></p>';return}loaded=await api({op:$('kind').value==='hooks'?'hooks-read':'read',path:x.path});if($('kind').value==='hooks'){hookSource(x);return}if(x.kind==='plugins'){pluginForm(x);return}documentForm(x,loaded.text)})}
function scopeHTML(){return '<label>Save scope</label><select id="scope"><option value="user">User · all projects</option>'+(project?'<option value="project">Selected project</option>':'')+(data.records||[]).filter(x=>x.kind==='plugins'&&x.scope==='Local draft').map(x=>'<option value="plugin:'+esc(x.path)+'">Plugin · '+esc(x.name)+'</option>').join('')+'</select>'}
function scopePayload(){let s=$('scope').value;return s.startsWith('plugin:')?{scope:'plugin',pluginPath:s.slice(7)}:{scope:s}}
function track(){$('detail').querySelectorAll('input,textarea,select,[contenteditable]').forEach(x=>x.addEventListener('input',()=>dirty=true))}
function newItem(){if($('kind').value==='jev'){jevForm();return}if(!leave())return;current=null;loaded={};dirty=false;let k=$('kind').value;if(k==='sessions'){message('Create an agent definition in the Agents tab. Sessions are monitored here.');return}if(k==='plugins')pluginForm(null);else if(k==='hooks')hookForm();else documentForm({kind:k,name:''},'');renderList()}
let skillDownload=null;
function importSkillForm(){if(!leave())return;current=null;dirty=false;skillDownload=null;$('detail').innerHTML='<h2>Import a command-line skill</h2><p>Paste a public GitHub repository, skill folder or raw SKILL.md URL. Fetch downloads files for review; importing is a separate step.</p><label>Source URL</label><input id="skillUrl" style="width:100%" placeholder="https://github.com/owner/repository"><div class="footer"><button class="primary" id="fetchSkill" onclick="fetchSkills()">Fetch & find skills</button></div><div id="skillResults"></div>';track()}
async function fetchSkills(){let url=$('skillUrl').value.trim();$('fetchSkill').disabled=true;message('Finding and downloading skills…');try{skillDownload=await api({op:'skill-discover',url});dirty=false;if(skillDownload.sources){$('skillResults').innerHTML='<h3>Possible skill sources</h3><p>Choose a link to fetch and check for skills.</p>'+skillDownload.sources.map(u=>'<button class="item skill-source" data-url="'+esc(u)+'">'+esc(u)+'</button>').join('');$('skillResults').querySelectorAll('.skill-source').forEach(b=>b.onclick=()=>{$('skillUrl').value=b.dataset.url;fetchSkills()});message(skillDownload.message);return}$('skillResults').innerHTML='<label>Discovered skills · '+skillDownload.candidates.length+'</label><select id="skillCandidate" style="width:100%" onchange="previewSkill()">'+skillDownload.candidates.map(x=>'<option value="'+esc(x.id)+'">'+esc(x.name)+' · '+esc(x.sourcePath)+'</option>').join('')+'</select><div id="skillPreview"></div>';previewSkill();message(skillDownload.message)}catch(e){message(e.message,true);$('skillResults').innerHTML='<h3>Need help from the repository owner?</h3><p>The importer cannot invent a skill package from an ordinary web page or access a private repository without authorization.</p><label>Request to copy into GitHub or your coding assistant</label><textarea id="skillRequest" readonly style="height:150px">'+esc('Please locate the Agent Skills package at '+url+'. Provide a public repository/folder URL containing SKILL.md and its required supporting files. If none exists, document how to create a Claude Code-compatible skill and its prerequisites. Do not execute downloaded scripts or overwrite existing skills.')+'</textarea><button onclick="copySkillRequest()">Copy request</button>'+(url.startsWith('https://github.com/')?'<a href="'+esc(url)+'">Open repository ↗</a>':'')}finally{$('fetchSkill').disabled=false}}
function previewSkill(){let x=skillDownload.candidates.find(x=>x.id===$('skillCandidate').value);$('skillPreview').innerHTML='<label>Import name</label><input id="skillName" style="width:100%" value="'+esc(x.name)+'"><label>Import into</label><select id="skillScope"><option value="user">Claude Code · user / all projects</option>'+(project?'<option value="project">Selected project</option>':'')+'</select><small>'+x.files.length+' files · '+Math.ceil(x.bytes/1024)+' KB · '+esc(skillDownload.revision?'Commit '+skillDownload.revision.slice(0,12):'Single document')+'</small><label>Review downloaded files</label><select id="skillFile" style="width:100%" onchange="previewSkillFile()">'+['SKILL.md',...x.files.filter(f=>f!=='SKILL.md')].map(f=>'<option>'+esc(f)+'</option>').join('')+'</select><textarea id="skillText" readonly style="height:200px">'+esc(x.text)+'</textarea><div class="footer"><button class="primary" onclick="importSelectedSkill()">Import skill…</button><button onclick="revealSkillDownload()">Review in Finder</button></div><small>Files are copied to your local skills folder. No downloaded scripts are executed during import. Existing skills are never overwritten.</small>';track()}
async function copySkillRequest(){await safe(async()=>{await api({op:'copy',text:$('skillRequest').value});message('Request copied. Paste it into GitHub or your coding assistant.')})}
async function revealSkillDownload(){let x=skillDownload.candidates.find(x=>x.id===$('skillCandidate').value);await safe(()=>api({op:'reveal',path:x.downloadPath}))}
async function previewSkillFile(){await safe(async()=>{let v=await api({op:'skill-preview',token:skillDownload.token,candidate:$('skillCandidate').value,file:$('skillFile').value});$('skillText').value=v.text})}
async function importSelectedSkill(){await safe(async()=>{let v=await api({op:'skill-import',token:skillDownload.token,candidate:$('skillCandidate').value,name:$('skillName').value,scope:$('skillScope').value});dirty=false;await refresh();message(v.message);let saved=data.records.find(x=>x.path===v.path);if(saved)await select(saved)})}
function scalar(front,key){let m=front.match(new RegExp('^'+key+':\\s*(.*)$','m'));if(!m)return '';try{return JSON.parse(m[1])}catch{return m[1].replace(/^['\"]|['\"]$/g,'')}}
function syncMeta(){let v=$('front').value;for(let key of ['description','model','tools']){let input=$(key+'Meta');if(!input)continue;let line=key+': '+JSON.stringify(input.value),rx=new RegExp('^'+key+':.*$','m');v=rx.test(v)?v.replace(rx,line):v+'\n'+line}$('front').value=v;dirty=true}
function documentForm(x,text){let isAgent=x.kind==='agents',m=text.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?/),front=m?m[1]:'',body=m?text.slice(m[0].length):text;
 $('detail').innerHTML='<h2>'+esc(x.name||'New '+(isAgent?'agent':x.kind==='skills'?'skill':'slash command'))+'</h2><small>'+esc(x.path||'Create a Markdown definition')+'</small><label>Name</label><input id="name" placeholder="code-reviewer" value="'+esc(x.name)+'">'+scopeHTML()+(isAgent?'<label>Description · when should Claude use this agent?</label><input id="descriptionMeta" style="width:100%" onchange="syncMeta()" value="'+esc(scalar(front,'description'))+'" placeholder="Review code changes for correctness and clarity"><div class="grid"><div><label>Model</label><select id="modelMeta" onchange="syncMeta()">'+['inherit','sonnet','opus','haiku'].map(v=>'<option '+(scalar(front,'model')===v?'selected':'')+'>'+v+'</option>').join('')+'</select></div><div><label>Tools · comma separated</label><input id="toolsMeta" onchange="syncMeta()" value="'+esc(scalar(front,'tools')||'Read, Grep, Glob')+'"></div></div>':'')+'<details><summary>Advanced YAML frontmatter</summary><textarea id="front">'+esc(front||('name: my-agent\ndescription: Explain when Claude should use this '+(isAgent?'agent':'definition')+(isAgent?'\nmodel: inherit\ntools: Read, Grep, Glob':'')))+'</textarea></details><div class="toolbar"><button onclick="toggleEditor()" id="toggle">Formatted editor</button><button onclick="format(\'bold\')"><b>B</b></button><button onclick="format(\'italic\')"><i>I</i></button><button onclick="format(\'underline\')"><u>U</u></button><button onclick="format(\'formatBlock\',\'h2\')">Heading</button><button onclick="format(\'insertUnorderedList\')">List</button><button onclick="insertTable()">Table</button></div><textarea id="source">'+esc(body)+'</textarea><div id="rich" class="editor hidden" contenteditable="true" role="textbox" aria-label="Agent instructions"></div><small>Markdown is saved on disk. Underline uses &lt;u&gt;…&lt;/u&gt; because Markdown has no native underline syntax. Keep source mode for unsupported Markdown constructs.</small><div class="footer"><button class="primary" onclick="saveDoc()" '+(x.readonly?'disabled':'')+'>Save Markdown</button>'+(x.path?'<button onclick="reveal()">Show in Finder</button>':'')+'</div>';
 rich=false;track();if(x.readonly){$('source').readOnly=true;$('front').readOnly=true;$('name').disabled=true}}
function inline(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/(?<!\*)\*([^*]+)\*(?!\*)/g,'<em>$1</em>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/&lt;u&gt;(.+?)&lt;\/u&gt;/g,'<u>$1</u>')}
function renderMarkdown(s){let lines=s.split('\n'),out=[];for(let i=0;i<lines.length;i++){let l=lines[i];if(l.startsWith('```')){let b=[];while(++i<lines.length&&!lines[i].startsWith('```'))b.push(lines[i]);out.push('<pre>'+esc(b.join('\n'))+'</pre>');continue}if(l.includes('|')&&/^\s*\|?\s*:?-{3,}/.test(lines[i+1]||'')){let cells=r=>r.trim().replace(/^\||\|$/g,'').split(/(?<!\\)\|/).map(x=>x.trim().replace(/\\\|/g,'|'));out.push('<table><thead><tr>'+cells(l).map(x=>'<th>'+inline(x)+'</th>').join('')+'</tr></thead><tbody>');i++;while(lines[i+1]?.includes('|'))out.push('<tr>'+cells(lines[++i]).map(x=>'<td>'+inline(x)+'</td>').join('')+'</tr>');out.push('</tbody></table>');continue}let h=l.match(/^(#{1,6})\s+(.*)/);if(h)out.push('<h'+h[1].length+'>'+inline(h[2])+'</h'+h[1].length+'>');else if(/^[-*] /.test(l))out.push('<ul><li>'+inline(l.slice(2))+'</li></ul>');else out.push('<div>'+inline(l||'')+'<br></div>')}return out.join('')}
function markdown(n){if(n.nodeType===3)return n.textContent;if(n.nodeType!==1)return '';let tag=n.tagName,c=[...n.childNodes].map(markdown).join('');if(['STRONG','B'].includes(tag))return '**'+c+'**';if(['EM','I'].includes(tag))return '*'+c+'*';if(tag==='U')return '<u>'+c+'</u>';if(tag==='BR')return '\n';if(tag==='PRE')return '\n```\n'+n.textContent+'\n```\n';if(tag==='CODE')return '`'+c+'`';if(/^H[1-6]$/.test(tag))return '\n'+'#'.repeat(+tag[1])+' '+c.trim()+'\n\n';if(tag==='LI')return '- '+c.trim()+'\n';if(tag==='TABLE'){let rows=[...n.rows].map(r=>[...r.cells].map(td=>[...td.childNodes].map(markdown).join('').trim().replace(/\n/g,'<br>').replace(/\|/g,'\\|')));if(!rows.length)return '';let width=Math.max(...rows.map(r=>r.length));rows=rows.map(r=>[...r,...Array(width-r.length).fill('')]);return '\n'+rows.map((r,i)=>'| '+r.join(' | ')+' |'+(i===0?'\n| '+r.map(()=> '---').join(' | ')+' |':'')).join('\n')+'\n\n'}if(['P','DIV','UL','OL','BLOCKQUOTE'].includes(tag))return c+'\n';return c}
function toggleEditor(){if(rich){$('source').value=markdown($('rich')).trim();}else{$('rich').innerHTML=renderMarkdown($('source').value)}rich=!rich;$('source').classList.toggle('hidden',rich);$('rich').classList.toggle('hidden',!rich);$('toggle').textContent=rich?'Markdown source':'Formatted editor'}
function format(cmd,value=null){if(!rich)toggleEditor();$('rich').focus();document.execCommand(cmd,false,value);dirty=true}
function insertTable(){if(!rich)toggleEditor();$('rich').focus();document.execCommand('insertHTML',false,'<table><tr><th>Column 1</th><th>Column 2</th></tr><tr><td>Value</td><td>Value</td></tr></table><div><br></div>');dirty=true}
async function saveDoc(){await safe(async()=>{if($('descriptionMeta')){if(!$('descriptionMeta').value.trim())throw Error('Describe when Claude should use this agent.');if(!current)syncMeta()}let body=rich?markdown($('rich')).trim():$('source').value,text=($('front').value.trim()?'---\n'+$('front').value.trim()+'\n---\n\n':'')+body+'\n';let v=await api({op:'save',kind:current?.kind||$('kind').value,name:$('name').value,text,path:current?.path,hash:loaded.hash,...scopePayload()});dirty=false;message(v.message);await refresh();let saved=data.records.find(x=>x.path===v.path);if(saved)await select(saved)})}
function reveal(){api({op:'reveal',path:current.path}).catch(e=>message(e.message,true))}
function pluginForm(x){$('detail').innerHTML=x?'<h2>'+esc(x.name)+'</h2><small>'+esc(x.path)+'</small><label>Plugin manifest · JSON</label><textarea id="manifest" style="height:240px">'+esc(loaded.text)+'</textarea><div class="footer">'+(!x.readonly?'<button class="primary" onclick="saveManifest()">Save manifest</button><button onclick="validatePlugin()">Validate</button><button onclick="installPlugin()">Install plugin</button>':'<button onclick="togglePlugin()">'+(x.enabled?'Disable':'Enable')+'</button>')+'<button onclick="reveal()">Show source folder</button></div><small>Create agents, skills, commands and hooks using their tabs and select this local draft as the save scope. Installed caches are read-only.</small>':'<h2>Create a plugin</h2><label>Name</label><input id="name" placeholder="my-tools"><label>Description</label><textarea id="description" rows="3"></textarea><label>Author</label><input id="author" placeholder="Your name"><p>Creates .claude-plugin/plugin.json and component folders in a local marketplace. Creation and installation are separate actions.</p><button class="primary" onclick="createPlugin()">Create plugin source</button>';track()}
async function createPlugin(){await safe(async()=>{let v=await api({op:'plugin-create',name:$('name').value,description:$('description').value,author:$('author').value});dirty=false;message(v.message);await refresh()})}
async function saveManifest(){await safe(async()=>{let v=await api({op:'plugin-manifest',path:current.path,text:$('manifest').value,hash:loaded.hash});dirty=false;message(v.message);await refresh()})}
async function validatePlugin(){await safe(async()=>{let v=await api({op:'plugin-validate',path:current.path});message(v.message+'\n'+JSON.stringify(v.report,null,2))})}
async function installPlugin(){await safe(async()=>{message('Installing through Claude Code…');let v=await api({op:'plugin-install',path:current.path});message(v.message);await refresh()})}
async function togglePlugin(){await safe(async()=>{let v=await api({op:'plugin-toggle',path:current.path,enabled:!current.enabled});message(v.message);await refresh()})}
function hookForm(){$('detail').innerHTML='<h2>Create an event hook</h2>'+scopeHTML()+'<label>Event</label><select id="event">'+(data.events||[]).map(x=>'<option>'+esc(x)+'</option>').join('')+'</select><label>Matcher · optional event filter</label><input id="matcher" placeholder="Write|Edit"><label>Hook type</label><select id="hookType"><option value="command">Shell command</option><option value="http">HTTP webhook</option></select><label>Command or HTTPS endpoint</label><textarea id="value" rows="3"></textarea><p>Hooks can run commands or send Claude event data when triggered. Saving does not execute the hook now.</p><button class="primary" onclick="saveHook()">Review & save hook</button><p><a href="https://code.claude.com/docs/en/hooks">Official hook reference ↗</a></p>';track()}

async function saveHook(){await safe(async()=>{let v=await api({op:'hook-save',event:$('event').value,matcher:$('matcher').value,type:$('hookType').value,value:$('value').value,...scopePayload()});dirty=false;message(v.message);await refresh()})}
function newProfile(){if(!leave())return;current=null;safe(()=>profileForm({name:'',kind:'Custom',auth:'keychain',secretRef:'openrouter'}))}
async function profileForm(x){let vault=await api({op:'secret-list'});$('detail').innerHTML='<h2>'+esc(x.name||'New gateway')+'</h2><div class="grid"><div><label>Profile name</label><input id="name" value="'+esc(x.name)+'" placeholder="My gateway"></div><div><label>Gateway type</label><select id="preset" onchange="preset()">'+['Custom','LiteLLM','Bifrost','Ollama'].map(k=>'<option '+(x.kind===k?'selected':'')+'>'+k+'</option>').join('')+'</select></div></div><label>Claude / Anthropic-compatible base URL</label><input style="width:100%" id="claudeUrl" value="'+esc(x.claudeUrl||'')+'"><label>Codex / Responses-compatible base URL</label><input style="width:100%" id="codexUrl" value="'+esc(x.codexUrl||'')+'"><label>Model discovery URL · optional override</label><input style="width:100%" id="modelsUrl" value="'+esc(x.modelsUrl||'')+'"><div id="ollamaFields" class="hidden"><label>Claude Code API base URL</label><input id="claudeCodeUrl" style="width:100%" value="'+esc(x.claudeCodeUrl||'http://localhost:11434')+'"><label>Ollama model · Claude Code and active Codex routing</label><input id="claudeModel" style="width:100%" value="'+esc(x.claudeModel||'')+'" list="ollamaModels"><datalist id="ollamaModels"></datalist><button onclick="loadOllamaModels()">Load Ollama models</button><p>Claude Desktop uses Ollama’s separate gateway on 127.0.0.1:11435. Enable Claude in Ollama’s menu-bar app first and configure its Desktop model mappings there. Claude Code and Codex use the normal API on 11434. Local Ollama does not need an API key. Choose a model that supports tools; Ollama recommends at least 64k context for coding clients. Cloud-tagged models may use Ollama Cloud and require Ollama sign-in. No model is downloaded by this app.</p><a href="https://docs.ollama.com/integrations/claude-code">Ollama setup guide ↗</a></div><label>Credential source</label><select id="auth" onchange="authFields()"><option value="keychain">macOS Keychain secret</option><option value="environment">Environment variable reference</option><option value="helper">Executable credential helper</option><option value="local">Local Ollama · no secret required</option></select><label id="secretReferenceLabel">Keychain secret</label><select id="profileSecretRef">'+vault.entries.filter(x=>!x.readonly).map(x=>'<option value="'+esc(x.id)+'">'+esc(x.label)+' · '+esc(x.status)+'</option>').join('')+'</select><label id="credentialLabel">Credential reference</label><input style="width:100%" id="credential" value="'+esc(x.auth==='helper'?x.helper:x.env||'GATEWAY_API_KEY')+'"><p>Enter an environment variable name or absolute executable path, never the key itself. Finder-launched apps need the variable available to launchctl or a helper that retrieves it securely.</p><label><input id="applyActive" type="checkbox" checked> Apply this profile to clients already using a gateway and offer to restart them</label><div class="footer"><button class="primary" onclick="saveProfile()">Save & select</button>'+(x.id?'<button onclick="selectProfile()">Apply to enabled clients</button>':'')+'</div><small>Apply routing separately in Connections. Server compatibility and enabled models depend on your proxy deployment.</small>';$('auth').value=x.auth;$('profileSecretRef').value=x.secretRef||'openrouter';authFields();track()}
function authFields(){let keychain=$('auth').value==='keychain';$('profileSecretRef').classList.toggle('hidden',!keychain);$('secretReferenceLabel').classList.toggle('hidden',!keychain);$('credential').classList.toggle('hidden',keychain||$('auth').value==='local');$('credentialLabel').classList.toggle('hidden',keychain||$('auth').value==='local');$('ollamaFields').classList.toggle('hidden',$('preset').value!=='Ollama');$('auth').querySelector('option[value=local]').disabled=$('preset').value!=='Ollama';$('credentialLabel').textContent=$('auth').value==='helper'?'Absolute helper script path':'Environment variable name · not the API key'}
function preset(){let k=$('preset').value;if(k==='LiteLLM'){$('claudeUrl').value='http://localhost:4000';$('codexUrl').value='http://localhost:4000/v1';$('modelsUrl').value='http://localhost:4000/v1/models'}if(k==='Bifrost'){$('claudeUrl').value='http://localhost:8080/anthropic';$('codexUrl').value='http://localhost:8080/openai/v1';$('modelsUrl').value='http://localhost:8080/v1/models'}if(k==='Ollama'){$('claudeUrl').value='http://127.0.0.1:11435';$('codexUrl').value='http://localhost:11434/v1';$('modelsUrl').value='http://localhost:11434/v1/models';$('auth').value='local'}else if($('auth').value==='local'){$('auth').value='keychain'}authFields();if(!$('name').value)$('name').value=k;dirty=true}
async function loadOllamaModels(){await safe(async()=>{let v=await api({op:'profile-models',modelsUrl:$('modelsUrl').value||$('codexUrl').value.replace(/\/$/,'')+'/models'});$('ollamaModels').innerHTML=v.models.map(m=>'<option value="'+esc(m)+'"></option>').join('');if(!$('claudeModel').value)$('claudeModel').value=v.models[0];message(v.models.length+' Ollama models found. Choose a tool-capable model.');dirty=true})}
async function saveProfile(){await safe(async()=>{let auth=$('auth').value,v=await api({op:'profile-save',id:current?.id,name:$('name').value,kind:$('preset').value,claudeUrl:$('claudeUrl').value,codexUrl:$('codexUrl').value,modelsUrl:$('modelsUrl').value,claudeModel:$('claudeModel').value,claudeCodeUrl:$('claudeCodeUrl').value,applyActive:$('applyActive').checked,auth,helper:auth==='helper'?$('credential').value:'',env:auth==='environment'?$('credential').value:'',secretRef:$('profileSecretRef').value});dirty=false;message(v.message);await refresh()})}
async function selectProfile(){await safe(async()=>{let v=await api({op:'profile-select',id:current.id,applyActive:$('applyActive').checked});message(v.message);await refresh()})}
document.addEventListener('mousedown',e=>{if(e.target.closest('.toolbar'))e.preventDefault()});
function cleanPaste(html){let doc=new DOMParser().parseFromString(html,'text/html');let allowed=new Set(['B','STRONG','I','EM','U','P','DIV','BR','H1','H2','H3','H4','H5','H6','TABLE','THEAD','TBODY','TR','TD','TH','UL','OL','LI','PRE','CODE']);function clean(n){if(n.nodeType===3)return esc(n.textContent);if(n.nodeType!==1||['SCRIPT','STYLE','IFRAME','OBJECT'].includes(n.tagName))return '';let content=[...n.childNodes].map(clean).join('');if(n.tagName==='SPAN'){if(n.style.fontWeight==='bold'||Number(n.style.fontWeight)>=600)content='<strong>'+content+'</strong>';if(n.style.fontStyle==='italic')content='<em>'+content+'</em>';if(n.style.textDecoration.includes('underline'))content='<u>'+content+'</u>';return content}return allowed.has(n.tagName)?'<'+n.tagName.toLowerCase()+'>'+content+(n.tagName==='BR'?'':'</'+n.tagName.toLowerCase()+'>'):content}return [...doc.body.childNodes].map(clean).join('')}
document.addEventListener('paste',e=>{if(e.target.isContentEditable){e.preventDefault();let html=e.clipboardData.getData('text/html');if(html)document.execCommand('insertHTML',false,cleanPaste(html));else document.execCommand('insertText',false,e.clipboardData.getData('text/plain'));dirty=true}});

async function jevForm(){let v=await api({op:'jev-status'});$('list').innerHTML='<button class="item active" onclick="safe(async()=>{if(leave())await jevForm()})"><strong>Jev</strong><small>OpenRouter · decisions & skills</small></button>';$('note').textContent='Suggestions preserve your selected LLM gateway and native skill permissions.';$('detail').innerHTML='<h2>Jev · decisions & skills</h2><p>Jev selects a relevant local skill, then checks its instruction excerpt. Uses the configured Jev model through OpenRouter, with your existing credential.</p><div style="background:white;border:1px solid #cdd4d0;border-radius:9px;padding:14px;margin-bottom:14px"><strong>OpenRouter · skill decisions</strong><small>'+esc(v.endpoint)+'</small><h3>Configuration</h3><label>Jev model ID</label><input id="jevModel" style="width:100%" value="'+esc(v.config.model)+'"><label>Credential source</label><select id="jevCredentialSource" onchange="jevCredentialFields()"><option value="keychain">macOS Keychain</option><option value="environment">Process environment · OPENROUTER_API_KEY</option></select><label>Keychain secret</label><select id="jevSecretRef">'+v.secretChoices.map(x=>'<option value="'+esc(x.id)+'">'+esc(x.label)+'</option>').join('')+'</select><button style="margin-left:10px" onclick="editJevSecret()">Add / replace key…</button><small>'+esc(v.credential)+' · '+(v.credentialAvailable?'Available':'Missing')+'</small><small>'+v.skillCount+' local definitions · Automatic skill hook '+(v.automaticHookPresent?'configured':'off')+' · Tavily '+(v.tavilyConfigured?'configured':'missing')+'</small><button style="margin-top:10px" onclick="testJevConnection()">Test OpenRouter connection</button><p style="margin-top:10px;margin-bottom:0">OpenRouter chooses skills. Your selected LLM gateway still handles conversations.</p><small>Settings: '+esc(v.settingsPath)+'</small><small>Secret values: macOS Keychain. This settings file stores only the selected secret reference.</small></div><label><input id="jevAutomatic" type="checkbox" '+(v.config.automatic?'checked':'')+'> Automatic Claude Code suggestions</label><label><input id="jevDesktop" type="checkbox" '+(v.config.desktop?'checked':'')+'> Claude Desktop · local skill MCP</label><label><input id="jevDecisionSupport" type="checkbox" '+(v.config.decisionSupport?'checked':'')+'> Claude Code · Jev decision help (ask every time)</label><p>Claude may propose a quick Jev decision. Each call requires your approval before its specific evidence is sent to OpenRouter.</p><label><input id="jevSearchFallback" type="checkbox" '+(v.config.searchFallback!==false?'checked':'')+'> Search Tavily when no installed skill matches</label><label><input id="jevReuseOAuth" type="checkbox" '+(v.config.reuseClaudeOAuth?'checked':'')+'> Use existing Claude Code Tavily OAuth sign-in</label><p>Search uses a general skill category, not your prompt text. Results are unverified until you fetch and inspect their files.</p><p>Automatic mode sends each Claude Code prompt, skill descriptions and up to 700 characters of the selected skill to OpenRouter. Desktop uses suggest_skill on request; read_skill loads its instructions locally. Scripts are not executed.</p><button class="primary" onclick="saveJev()">Apply Jev settings</button><label>Try a request · sends this text to OpenRouter</label><textarea id="jevPrompt" rows="3" placeholder="Review this pull request and suggest a useful skill"></textarea><button onclick="testJev()">Suggest a skill</button><div id="jevResults"></div><h3>Recent activity</h3><div id="jevActivity"></div><small>Last 20 checks only. No prompts, instruction text or credentials are logged.</small><p><a href="https://openrouter.ai/typesafe/jev-1.13/api">OpenRouter model ↗</a></p>';$('jevCredentialSource').value=v.config.credentialSource||'keychain';$('jevSecretRef').value=v.config.secretRef||'openrouter';jevCredentialFields();renderJevActivity(v.recent);track()}
async function saveJev(){await safe(async()=>{let automatic=$('jevAutomatic').checked;if(automatic&&!confirm('Send each Claude Code prompt and local skill metadata to OpenRouter for automatic suggestions?'))return;let v=await api({op:'jev-save',automatic,desktop:$('jevDesktop').checked,consent:automatic,searchFallback:$('jevSearchFallback').checked,model:$('jevModel').value.trim(),decisionSupport:$('jevDecisionSupport').checked,credentialSource:$('jevCredentialSource').value,secretRef:$('jevSecretRef').value,reuseClaudeOAuth:$('jevReuseOAuth').checked});dirty=false;message(v.message)})}
async function testJev(){await safe(async()=>{message('Asking Jev through OpenRouter…');let v=await api({op:'jev-test',prompt:$('jevPrompt').value});message(v.message+(v.confidence?' Confidence: '+Math.round(v.confidence*100)+'%.':''));showJevDiscovery(v.discovery);let state=await api({op:'jev-status'});renderJevActivity(state.recent)})}
function showJevDiscovery(d){let target=$('jevResults');if(!target)return;target.innerHTML='';if(!d)return;let heading=document.createElement('h3');heading.textContent='Skills found through Tavily';target.append(heading);for(let candidate of d.candidates||[]){let card=document.createElement('div');card.style.marginBottom='15px';let title=document.createElement('strong');title.textContent=candidate.title;let desc=document.createElement('p');desc.textContent=candidate.description;let source=document.createElement('a');source.href=candidate.url;source.textContent='Open source ↗';let review=document.createElement('button');review.textContent='Review & import…';review.style.marginLeft='10px';review.onclick=()=>reviewDiscoveredSkill(candidate.url);card.append(title,desc,source,review);target.append(card)}if(!d.candidates?.length)target.textContent='No suitable public source found. Try a more specific request.'}
async function reviewDiscoveredSkill(url){if(!leave())return;dirty=false;$('kind').value='skills';if(mode==='mods'){data=await api({op:'inventory'})}else{await refresh()}importSkillForm();$('skillUrl').value=url;await fetchSkills()}
function renderJevActivity(rows){let target=$('jevActivity');target.innerHTML='';for(let row of rows||[]){let div=document.createElement('div');div.style.padding='8px 0';div.style.borderBottom='1px solid #d6dbd2';div.textContent=new Date(row.time).toLocaleString()+' · '+row.operation+' · '+row.outcome+' · '+(row.durationMs/1000).toFixed(1)+'s'+(row.sourceCount?' · '+row.sourceCount+' sources':'');target.append(div)}if(!rows?.length)target.textContent='No checks recorded yet. Test the connection or suggest a skill.'}
async function testJevConnection(){await safe(async()=>{message('Testing OpenRouter with a synthetic request…');let v=await api({op:'jev-connection-test'});message(v.message);let state=await api({op:'jev-status'});renderJevActivity(state.recent)})}
function secretForm(x){$('detail').innerHTML='<h2>'+esc(x.label)+'</h2><p>'+esc(x.purpose)+'</p><label>Status</label><strong>'+esc(x.status)+'</strong><label>Storage</label><div>'+esc(x.storage)+'</div><label>Keychain service</label><div>'+esc(x.service)+'</div><label>Account</label><div>'+esc(x.account||'Client-managed')+'</div><label>Reference ID · used in configuration</label><div>'+esc(x.id)+'</div><p style="margin-top:18px">'+(x.readonly?'This is the client’s OAuth credential bundle. Authorize or reconnect through Claude Code /mcp. The app does not edit its tokens.':'Choose this named secret in Mods → Jev or Gateway profiles → Credential source → macOS Keychain. Adding a secret does not automatically route a client to a new provider.')+'</p>'+(!x.readonly?'<div class="footer"><button class="primary" onclick="editSecret(current.id)">'+(x.status==='Available'?'Replace secret…':'Add value…')+'</button><button onclick="removeSecret(current.id)">Remove value…</button></div>':'')+'<small>Secret values are never returned to this page, copied into JSON or shown in activity logs.</small>'}
async function editSecret(id){await safe(async()=>{let v=await api({op:'secret-edit',id});if(v.cancelled)return;dirty=false;await refresh();message(v.message);if(mode==='secrets'){current=data.entries.find(x=>x.id===v.id);if(current){secretForm(current);renderList()}}})}
async function removeSecret(id){await safe(async()=>{let v=await api({op:'secret-remove',id});if(v.cancelled)return;await refresh();message(v.message)})}
function jevCredentialFields(){$('jevSecretRef').disabled=$('jevCredentialSource').value!=='keychain'}
async function editJevSecret(){await safe(async()=>{let v=await api({op:'secret-edit',id:$('jevSecretRef').value});if(!v.cancelled)message(v.message+' Apply Jev settings if you changed the selected reference.')})}
